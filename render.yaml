# Render.com — API (Node). Staticki frontend mojput.com: build s `npm run build` (koristi .env.production) pa upload / CI.
# VITE_BASE_PATH, VITE_API_URL, VITE_GA_* — ne ide na ovaj servis; one su samo u buildu frontenda, ne u API procesu.
services:
  - type: web
    name: mojput-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Oba rade: / (plain "ok") i /api/health — ako deploy „failed“ bez build greške, probaj healthCheckPath: /
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Javni URL API-ja = isti kao VITE_API_URL u produkcijskom buildu. Link u mailu: …/api/auth/…
      - key: API_PUBLIC_URL
        value: https://mojput.onrender.com
      # Javni frontend mojput.com (linkovi u mailu, CORS, redirecti)
      - key: APP_ORIGIN
        value: https://mojput.com
      # U dashboardu još: JWT_SECRET + RESEND_API_KEY (+ opcionalno RESEND_FROM; prazno = onboarding@resend.dev) ili SMTP_*
      # Ako mijenjaš URL servisa, prilagodi API_PUBLIC_URL i VITE_API_URL u buildu.
      # Trajni korisnici: na Renderu (besplatno) dodaj MOJPUT_DATABASE_URL = Neon ili Supabase PostgreSQL connection string.
      # Alternativa: plaćeni Persistent Disk + MOJPUT_DATA_DIR (SQLite datoteka).
