# Render.com — „New Blueprint Instance” s ovog repozitorija
# Nakon deploya kopiraj javni URL servisa u APP_ORIGIN (frontend) i API_PUBLIC_URL
services:
  - type: web
    name: mojput-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Oba rade: / (plain "ok") i /api/health — ako deploy „failed“ bez build greške, probaj healthCheckPath: /
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Javni URL ovog API-ja — isti kao VITE_API_URL u buildu za GitHub Pages. Link u mailu: …/api/auth/verify?…
      - key: API_PUBLIC_URL
        value: https://mojput.onrender.com
      # Frontend (GitHub Pages) — redirect nakon klika na potvrdu u mailu
      - key: APP_ORIGIN
        value: https://tonisinkovic.github.io
      # U dashboardu još: JWT_SECRET + RESEND_API_KEY (+ opcionalno RESEND_FROM; prazno = onboarding@resend.dev) ili SMTP_*
      # Ako mijenjaš URL servisa, prilagodi API_PUBLIC_URL i VITE_API_URL u buildu.
      # Trajni korisnici: na Renderu (besplatno) dodaj MOJPUT_DATABASE_URL = Neon ili Supabase PostgreSQL connection string.
      # Alternativa: plaćeni Persistent Disk + MOJPUT_DATA_DIR (SQLite datoteka).
